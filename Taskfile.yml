version: "3"

# Load DB_* and other vars for coordinator helpers (optional file — ignored if absent in your Task version)
dotenv:
  - .env

tasks:
  dump:runchecks:
    desc: Dump RunChecks JSON + runchecks-live-meta.json (geo по storage IP). Default in-memory; use --storage=postgres + DB_* for DB
    cmds:
      - go run ./cmd/dump-runchecks --limit 50 --out tmp/runchecks-live.json

  dump:runchecks:with-storage-rates:
    desc: "Same as dump:runchecks plus tmp/runchecks-live-storage-rates.json for RunStorageRates grpcurl"
    cmds:
      - go run ./cmd/dump-runchecks --limit 50 --out tmp/runchecks-live.json --also-dump-storage-rates

  deploy:init:
    desc: Prepare coordinator deploy env and secrets placeholders
    cmds:
      - mkdir -p deploy/secrets
      - |
        if [ ! -f deploy/.env ]; then
          cp deploy/.env.example deploy/.env
          echo "Created deploy/.env from .env.example"
        else
          echo "deploy/.env already exists"
        fi
      - |
        if [ ! -f deploy/secrets/agents-ca.crt ]; then
          echo "Place CA cert into deploy/secrets/agents-ca.crt"
        fi
      - |
        if [ ! -f deploy/secrets/metrics.token ]; then
          printf '%s\n' "metrics-token" > deploy/secrets/metrics.token
          echo "Created placeholder deploy/secrets/metrics.token"
        fi

  deploy:up:
    desc: Build and start coordinator deploy stack
    cmds:
      - docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build

  deploy:down:
    desc: Stop coordinator deploy stack
    cmds:
      - docker compose --env-file deploy/.env -f deploy/docker-compose.yml down

  deploy:ps:
    desc: Show coordinator deploy stack containers
    cmds:
      - docker compose --env-file deploy/.env -f deploy/docker-compose.yml ps

  deploy:logs:
    desc: Follow logs for coordinator deploy stack
    cmds:
      - docker compose --env-file deploy/.env -f deploy/docker-compose.yml logs -f

  deploy:frontend:
    desc: Deploy frontend only (deps + nginx + build + static deploy)
    cmds:
      - |
        if [ -z "${DOMAIN:-}" ]; then
          echo "DOMAIN is required, e.g. DOMAIN=front.example.com"
          exit 1
        fi
      - |
        if [ -z "${PUBLIC_ORIGIN:-}" ]; then
          echo "PUBLIC_ORIGIN is required, e.g. PUBLIC_ORIGIN=https://front.example.com"
          exit 1
        fi
      - bash deploy/deploy_frontend.sh

  hub:init:
    desc: Prepare coordinator hub deploy env and secrets placeholders
    cmds:
      - mkdir -p deploy/secrets
      - |
        if [ ! -f deploy/.env.hub ]; then
          cp deploy/.env.hub.example deploy/.env.hub
          echo "Created deploy/.env.hub from .env.hub.example"
        else
          echo "deploy/.env.hub already exists"
        fi
      - |
        if [ ! -f deploy/secrets/agents-ca.crt ]; then
          echo "Place CA cert into deploy/secrets/agents-ca.crt"
        fi
      - |
        if [ ! -f deploy/secrets/metrics.token ]; then
          printf '%s\n' "metrics-token" > deploy/secrets/metrics.token
          echo "Created placeholder deploy/secrets/metrics.token"
        fi

  hub:up:
    desc: Pull and start coordinator deploy stack from registry image (no local build)
    cmds:
      - docker compose --env-file deploy/.env.hub -f deploy/docker-compose.hub.yml up -d

  hub:down:
    desc: Stop hub coordinator deploy stack
    cmds:
      - docker compose --env-file deploy/.env.hub -f deploy/docker-compose.hub.yml down

  hub:ps:
    desc: Show hub coordinator deploy stack containers
    cmds:
      - docker compose --env-file deploy/.env.hub -f deploy/docker-compose.hub.yml ps

  hub:logs:
    desc: Follow logs for hub coordinator deploy stack
    cmds:
      - docker compose --env-file deploy/.env.hub -f deploy/docker-compose.hub.yml logs -f

  image:build:
    desc: Build coordinator image locally (set COORDINATOR_IMAGE)
    cmds:
      - |
        if [ -z "${COORDINATOR_IMAGE:-}" ]; then
          echo "COORDINATOR_IMAGE is required, e.g. COORDINATOR_IMAGE=ghcr.io/mytonprovider/mytonprovider-backend:<tag> task image:build"
          exit 1
        fi
      - docker build --platform linux/amd64 -f Dockerfile -t "${COORDINATOR_IMAGE}" .

  image:push:
    desc: Push prebuilt coordinator image (set COORDINATOR_IMAGE)
    cmds:
      - |
        if [ -z "${COORDINATOR_IMAGE:-}" ]; then
          echo "COORDINATOR_IMAGE is required, e.g. COORDINATOR_IMAGE=ghcr.io/mytonprovider/mytonprovider-backend:<tag> task image:push"
          exit 1
        fi
      - docker push "${COORDINATOR_IMAGE}"

  image:build:push:
    desc: Build and push coordinator image (set COORDINATOR_IMAGE)
    cmds:
      - task: image:build
      - task: image:push
